<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulasi Tata Surya Sederhana</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02040a;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    #scene-container {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    /* Panel kontrol */
    .control-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      width: min(300px, calc(100vw - 40px));
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      background: rgba(8, 12, 25, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }

    .control-panel h1 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 16px;
      color: #aab4ca;
      font-size: 12px;
      line-height: 1.5;
    }

    #toggleAnimation {
      width: 100%;
      padding: 10px 14px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #ffb300, #ff6f00);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
    }

    #toggleAnimation:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    #toggleAnimation:active {
      transform: translateY(0);
    }

    .slider-row {
      margin-top: 18px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }

    #speedValue {
      color: #ffd166;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #ffb300;
      cursor: pointer;
    }

    /* Informasi */
    .info-panel {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: min(340px, calc(100vw - 40px));
      padding: 15px 17px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: rgba(8, 12, 25, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 10;
      font-size: 12px;
      line-height: 1.6;
      color: #c7d0e5;
    }

    .info-title {
      margin-bottom: 5px;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
    }

    .status {
      color: #7dff9b;
      font-weight: 700;
    }

    .hint {
      position: fixed;
      right: 20px;
      top: 20px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(8, 12, 25, 0.6);
      color: #9da8bd;
      font-size: 11px;
      z-index: 10;
    }

    @media (max-width: 600px) {
      .control-panel {
        top: 12px;
        left: 12px;
        padding: 14px;
      }

      .hint {
        display: none;
      }

      .info-panel {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>

<body>
  <div id="scene-container"></div>

  <div class="control-panel">
    <h1>☀️ Simulasi Tata Surya</h1>
    <p class="subtitle">
      Model sederhana hubungan orbit Matahari, Bumi, dan Bulan.
    </p>

    <button id="toggleAnimation">⏸ Pause</button>

    <div class="slider-row">
      <div class="slider-header">
        <span>Kecepatan Orbit</span>
        <span id="speedValue">1.0×</span>
      </div>

      <input
        id="speedSlider"
        type="range"
        min="0"
        max="3"
        step="0.1"
        value="1"
        aria-label="Kecepatan orbit"
      />
    </div>
  </div>

  <div class="hint">
    🖱️ Drag untuk memutar · Scroll untuk zoom
  </div>

  <div class="info-panel">
    <div class="info-title">Status Simulasi</div>
    <div>
      Animasi:
      <span id="statusAnimation" class="status">Berjalan</span>
    </div>
    <div>
      Kecepatan:
      <span id="statusSpeed">1.0×</span>
    </div>
    <div>
      Sistem terdiri dari Matahari, Bumi, dan Bulan.
    </div>
  </div>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
    // =========================================================
    // 1. SETUP DASAR THREE.JS
    // =========================================================

    const container = document.getElementById("scene-container");

    const scene = new THREE.Scene();

    // Background ruang angkasa
    scene.background = new THREE.Color(0x02040a);

    // Kamera
    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.1,
      2000
    );

    camera.position.set(0, 45, 85);
    camera.lookAt(0, 0, 0);

    // Renderer
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    container.appendChild(renderer.domElement);


    // =========================================================
    // 2. UTILITAS ORBIT KAMERA
    //    Implementasi sederhana tanpa library tambahan.
    // =========================================================

    let cameraDistance = 85;
    let cameraTheta = 0.0;
    let cameraPhi = 1.05;

    let isDragging = false;
    let previousMouseX = 0;
    let previousMouseY = 0;

    renderer.domElement.addEventListener("pointerdown", (event) => {
      isDragging = true;
      previousMouseX = event.clientX;
      previousMouseY = event.clientY;

      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!isDragging) return;

      const deltaX = event.clientX - previousMouseX;
      const deltaY = event.clientY - previousMouseY;

      previousMouseX = event.clientX;
      previousMouseY = event.clientY;

      cameraTheta -= deltaX * 0.008;
      cameraPhi -= deltaY * 0.008;

      // Batasi sudut vertikal agar kamera tidak terbalik
      cameraPhi = Math.max(0.2, Math.min(Math.PI - 0.2, cameraPhi));
    });

    renderer.domElement.addEventListener("pointerup", (event) => {
      isDragging = false;

      try {
        renderer.domElement.releasePointerCapture(event.pointerId);
      } catch (_) {}
    });

    renderer.domElement.addEventListener("pointercancel", () => {
      isDragging = false;
    });

    renderer.domElement.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();

        cameraDistance += event.deltaY * 0.05;
        cameraDistance = Math.max(30, Math.min(180, cameraDistance));
      },
      { passive: false }
    );


    // =========================================================
    // 3. PENCAYAHAN
    // =========================================================

    // Ambient sangat redup agar sisi gelap planet tetap terlihat
    const ambientLight = new THREE.AmbientLight(0x253050, 0.18);
    scene.add(ambientLight);

    // Cahaya Matahari
    const sunLight = new THREE.PointLight(
      0xffe6a3,
      1800,
      500,
      2
    );

    sunLight.position.set(0, 0, 0);
    sunLight.castShadow = true;

    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;

    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 300;

    scene.add(sunLight);


    // =========================================================
    // 4. BINTANG-BINTANG
    // =========================================================

    function createStars(count = 2500) {
      const positions = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        // Distribusi bintang dalam bola besar
        const radius = 300 + Math.random() * 500;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        positions[i * 3] =
          radius * Math.sin(phi) * Math.cos(theta);

        positions[i * 3 + 1] =
          radius * Math.cos(phi);

        positions[i * 3 + 2] =
          radius * Math.sin(phi) * Math.sin(theta);
      }

      const geometry = new THREE.BufferGeometry();

      geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(positions, 3)
      );

      const material = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.8,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.85
      });

      return new THREE.Points(geometry, material);
    }

    scene.add(createStars());


    // =========================================================
    // 5. MATAHARI
    // =========================================================

    const sunGeometry = new THREE.SphereGeometry(7, 64, 64);

    const sunMaterial = new THREE.MeshBasicMaterial({
      color: 0xffb300
    });

    const sun = new THREE.Mesh(
      sunGeometry,
      sunMaterial
    );

    sun.position.set(0, 0, 0);
    scene.add(sun);


    // Efek halo Matahari
    const haloGeometry = new THREE.SphereGeometry(8.8, 64, 64);

    const haloMaterial = new THREE.MeshBasicMaterial({
      color: 0xff8c00,
      transparent: true,
      opacity: 0.10,
      side: THREE.BackSide,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const sunHalo = new THREE.Mesh(
      haloGeometry,
      haloMaterial
    );

    scene.add(sunHalo);


    // =========================================================
    // 6. ORBIT BUMI
    // =========================================================

    const earthOrbitRadius = 28;

    const earthOrbitCurve = new THREE.EllipseCurve(
      0,
      0,
      earthOrbitRadius,
      earthOrbitRadius,
      0,
      Math.PI * 2,
      false,
      0
    );

    const earthOrbitPoints =
      earthOrbitCurve.getPoints(256);

    const earthOrbitGeometry =
      new THREE.BufferGeometry().setFromPoints(
        earthOrbitPoints.map(
          (p) => new THREE.Vector3(p.x, 0, p.y)
        )
      );

    const orbitMaterial = new THREE.LineBasicMaterial({
      color: 0x3d5875,
      transparent: true,
      opacity: 0.55
    });

    const earthOrbitLine = new THREE.LineLoop(
      earthOrbitGeometry,
      orbitMaterial
    );

    scene.add(earthOrbitLine);


    // =========================================================
    // 7. GRUP BUMI
    //    Group memudahkan Bumi mengorbit Matahari.
    // =========================================================

    const earthOrbitGroup = new THREE.Group();
    scene.add(earthOrbitGroup);

    const earthSystem = new THREE.Group();

    earthSystem.position.set(
      earthOrbitRadius,
      0,
      0
    );

    earthOrbitGroup.add(earthSystem);


    // Bumi
    const earthGeometry =
      new THREE.SphereGeometry(2.8, 48, 48);

    const earthMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x2878d0,
        roughness: 0.65,
        metalness: 0.05
      });

    const earth = new THREE.Mesh(
      earthGeometry,
      earthMaterial
    );

    earth.castShadow = true;
    earth.receiveShadow = true;

    earthSystem.add(earth);


    // Atmosfer tipis
    const atmosphereGeometry =
      new THREE.SphereGeometry(3.0, 48, 48);

    const atmosphereMaterial =
      new THREE.MeshBasicMaterial({
        color: 0x4db8ff,
        transparent: true,
        opacity: 0.12,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

    const atmosphere = new THREE.Mesh(
      atmosphereGeometry,
      atmosphereMaterial
    );

    earthSystem.add(atmosphere);


    // =========================================================
    // 8. ORBIT BULAN
    // =========================================================

    const moonOrbitRadius = 7;

    const moonOrbitGeometry =
      new THREE.RingGeometry(
        moonOrbitRadius - 0.025,
        moonOrbitRadius + 0.025,
        128
      );

    const moonOrbitMaterial =
      new THREE.MeshBasicMaterial({
        color: 0x63738b,
        transparent: true,
        opacity: 0.55,
        side: THREE.DoubleSide
      });

    const moonOrbit = new THREE.Mesh(
      moonOrbitGeometry,
      moonOrbitMaterial
    );

    moonOrbit.rotation.x = Math.PI / 2;

    earthSystem.add(moonOrbit);


    // Grup Bulan
    const moonOrbitGroup = new THREE.Group();

    earthSystem.add(moonOrbitGroup);

    const moonSystem = new THREE.Group();

    moonSystem.position.set(
      moonOrbitRadius,
      0,
      0
    );

    moonOrbitGroup.add(moonSystem);


    // Bulan
    const moonGeometry =
      new THREE.SphereGeometry(0.9, 40, 40);

    const moonMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xb8b8b8,
        roughness: 0.9,
        metalness: 0
      });

    const moon = new THREE.Mesh(
      moonGeometry,
      moonMaterial
    );

    moon.castShadow = true;
    moon.receiveShadow = true;

    moonSystem.add(moon);


    // =========================================================
    // 9. LABEL SEDERHANA
    // =========================================================

    function createLabel(text, color) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 64;

      const ctx = canvas.getContext("2d");

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.font = "bold 28px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = color;

      ctx.shadowColor = "rgba(0,0,0,0.8)";
      ctx.shadowBlur = 6;

      ctx.fillText(text, 128, 32);

      const texture =
        new THREE.CanvasTexture(canvas);

      texture.colorSpace = THREE.SRGBColorSpace;

      const material =
        new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          depthWrite: false
        });

      const sprite = new THREE.Sprite(material);

      sprite.scale.set(8, 2, 1);

      return sprite;
    }

    const sunLabel =
      createLabel("MATAHARI", "#ffd166");

    sunLabel.position.set(0, 9, 0);
    scene.add(sunLabel);

    const earthLabel =
      createLabel("BUMI", "#72c7ff");

    earthLabel.position.set(0, 4.3, 0);
    earthSystem.add(earthLabel);

    const moonLabel =
      createLabel("BULAN", "#dddddd");

    moonLabel.scale.set(5, 1.25, 1);
    moonLabel.position.set(0, 2, 0);
    moonSystem.add(moonLabel);


    // =========================================================
    // 10. KONTROL UI
    // =========================================================

    const toggleButton =
      document.getElementById("toggleAnimation");

    const speedSlider =
      document.getElementById("speedSlider");

    const speedValue =
      document.getElementById("speedValue");

    const statusAnimation =
      document.getElementById("statusAnimation");

    const statusSpeed =
      document.getElementById("statusSpeed");

    let isRunning = true;
    let simulationSpeed = 1.0;

    toggleButton.addEventListener("click", () => {
      isRunning = !isRunning;

      if (isRunning) {
        toggleButton.textContent = "⏸ Pause";
        statusAnimation.textContent = "Berjalan";
        statusAnimation.style.color = "#7dff9b";
      } else {
        toggleButton.textContent = "▶ Play";
        statusAnimation.textContent = "Dijeda";
        statusAnimation.style.color = "#ffcc66";
      }
    });

    speedSlider.addEventListener("input", () => {
      simulationSpeed =
        Number(speedSlider.value);

      speedValue.textContent =
        simulationSpeed.toFixed(1) + "×";

      statusSpeed.textContent =
        simulationSpeed.toFixed(1) + "×";
    });


    // =========================================================
    // 11. ANIMASI
    // =========================================================

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta =
        Math.min(clock.getDelta(), 0.05);

      // Update simulasi hanya ketika Play
      if (isRunning) {
        /*
         * Nilai ini sengaja dibuat relatif.
         * Tujuannya memberikan visual orbit yang nyaman
         * untuk simulasi interaktif, bukan skala waktu astronomi
         * sebenarnya.
         */

        const earthOrbitSpeed =
          0.45 * simulationSpeed;

        const moonOrbitSpeed =
          1.6 * simulationSpeed;

        const earthRotationSpeed =
          1.2 * simulationSpeed;

        const moonRotationSpeed =
          1.0 * simulationSpeed;

        // Bumi mengelilingi Matahari
        earthOrbitGroup.rotation.y +=
          earthOrbitSpeed * delta;

        // Bumi berotasi pada porosnya
        earth.rotation.y +=
          earthRotationSpeed * delta;

        // Bulan mengelilingi Bumi
        moonOrbitGroup.rotation.y +=
          moonOrbitSpeed * delta;

        // Bulan berotasi
        moon.rotation.y +=
          moonRotationSpeed * delta;

        // Rotasi Matahari
        sun.rotation.y +=
          0.12 * simulationSpeed * delta;

        // Sedikit gerakan halo agar lebih hidup
        sunHalo.rotation.y -=
          0.04 * simulationSpeed * delta;
      }


      // =======================================================
      // Update kamera
      // =======================================================

      camera.position.x =
        Math.sin(cameraTheta) *
        Math.sin(cameraPhi) *
        cameraDistance;

      camera.position.y =
        Math.cos(cameraPhi) *
        cameraDistance;

      camera.position.z =
        Math.cos(cameraTheta) *
        Math.sin(cameraPhi) *
        cameraDistance;

      camera.lookAt(0, 0, 0);


      // =======================================================
      // Render
      // =======================================================

      renderer.render(scene, camera);
    }


    // =========================================================
    // 12. RESPONSIVE
    // =========================================================

    window.addEventListener("resize", () => {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );
    });


    // =========================================================
    // 13. MULAI
    // =========================================================

    animate();
  </script>
</body>
</html>
